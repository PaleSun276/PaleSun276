name: Render profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button
  push:
    paths: [profile.json, scripts/**]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards and READMEs
        run: python scripts/render_readme_cards.py
        env:
          # PROFILE_TOKEN = your read-only token (repo secret); falls back to the built-in one (public data only)
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "profile-cards[bot]"
          git config user.email "profile-cards[bot]@users.noreply.github.com"
          git add -A cards data README.md README.fr.md
          git diff --cached --quiet || git commit -m "Update profile cards" && git push
